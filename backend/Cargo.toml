[package]
name = "veluryn-backend"
version = "0.1.0"
edition = "2024"
description = "High-performance Rust backend (Axum) for VELURYN AGNECY with security headers, CORS, per-IP rate limiting, AI chat, and lead capture"
license = "MIT"

[[bin]]
name = "veluryn-backend"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
